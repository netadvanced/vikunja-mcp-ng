# ---------------------------------------------------------------------------
# Tag-triggered release workflow — the ONLY active workflow in this repository.
#
# Trigger: pushing a `vX.Y.Z` tag (which only happens via scripts/release-tag.sh,
# see docs/RELEASING.md). PRs and branch pushes never run Actions here — that is
# a deliberate owner decision ("only releases run CI"); the inherited ci.yml and
# security.yml were removed when this was installed (2026-07-20).
#
# Also runnable via workflow_dispatch with an existing tag, to re-publish
# artifacts for a release whose run failed partway (see "Idempotency" below).
#
# npm auth: OIDC Trusted Publishing — NO tokens, NO repository secrets. npmjs.com
# is configured (package settings → Trusted Publisher) to trust this exact repo +
# workflow filename; npm ≥ 11.5.1 exchanges the Actions OIDC token automatically
# at publish time, and provenance attestation is generated by default.
# GHCR push and the GitHub release use the built-in GITHUB_TOKEN.
#
# NO QEMU (#203). arm64 images are built on NATIVE `ubuntu-24.04-arm` runners,
# free for public repositories. Emulated arm64 builds died here: QEMU raised
# "uncaught target signal 4 (Illegal instruction)" inside `npm ci` and then HUNG
# until the 6-hour job limit cancelled the run — silently, after npm publish had
# already succeeded, so v0.6.1 and v0.6.2 both shipped to npm with no image and
# no GitHub release. Each arch now builds on its own runner, pushes by digest,
# and a merge job assembles the manifest list.
#
# Prereleases: a tag whose version carries a semver prerelease suffix
# (`v0.7.0-beta.1`) is published under that identifier as its dist-tag — `beta`
# on npm, `beta` on GHCR — and the GitHub release is marked as a pre-release.
# `latest` is left pointing at the newest stable on both registries, because
# `npm install vikunja-mcp-ng` and `docker pull ...:latest` resolve it, and a
# beta answering those would ship untested code to users who never opted in.
# Testers opt in explicitly with `npm install vikunja-mcp-ng@beta`.
#
# Idempotency: every publishing step is safe to re-run. npm publish is skipped
# when the version is already on the registry, image tags are simply overwritten
# with the same content, and `gh release create` is skipped when the release
# exists. That is what makes workflow_dispatch a usable recovery path.
#
# Local fallback: scripts/release-publish.sh remains fully equivalent (minus
# provenance) if Actions is ever unavailable.
# ---------------------------------------------------------------------------

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)publish artifacts for, e.g. v0.6.2'
        required: true
        type: string

permissions:
  contents: write # gh release create
  packages: write # ghcr.io push
  id-token: write # npm OIDC trusted publishing

env:
  IMAGE: ghcr.io/netadvanced/vikunja-mcp-ng

jobs:
  # ---------------------------------------------------------------------------
  # Gates + npm. Everything downstream depends on this passing.
  # ---------------------------------------------------------------------------
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
      version: ${{ steps.ref.outputs.version }}
      prerelease: ${{ steps.ref.outputs.prerelease }}
      dist_tag: ${{ steps.ref.outputs.dist_tag }}
      compat: ${{ steps.vikunja-compat.outputs.value }}
      min: ${{ steps.vikunja-min.outputs.value }}
    steps:
      - name: Resolve tag
        id: ref
        # Derives the dist-tag from the version itself, so tagging is the only decision a
        # release makes. Semver: everything after the first hyphen is a prerelease
        # identifier, and its first dot-separated field names the channel — `0.7.0-beta.1`
        # publishes to `beta`, `0.7.0-rc.2` to `rc`. A bare `0.7.0` publishes to `latest`,
        # exactly as every release before this step existed did.
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "${VERSION}" == *-* ]]; then
            CHANNEL="${VERSION#*-}"     # 0.7.0-beta.1 -> beta.1
            CHANNEL="${CHANNEL%%.*}"    #              -> beta
            # A purely numeric identifier (`0.7.0-1`) is legal semver but a useless
            # dist-tag, and npm rejects a dist-tag that parses as a version. Fall back.
            if [[ -z "${CHANNEL}" || "${CHANNEL}" =~ ^[0-9]+$ ]]; then
              CHANNEL="next"
            fi
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "dist_tag=${CHANNEL}" >> "$GITHUB_OUTPUT"
            echo "::notice::${TAG} is a prerelease — publishing to the '${CHANNEL}' dist-tag; 'latest' stays where it is."
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.tag }}
          fetch-depth: 0 # full history — needed to read the CHANGELOG.md section for this tag

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports OIDC trusted publishing (>= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          TAG_NAME="${{ steps.ref.outputs.tag }}"
          PKG_VERSION="v$(node -pe "require('./package.json').version")"
          if [[ "$TAG_NAME" != "$PKG_VERSION" ]]; then
            echo "::error::Tag $TAG_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Determine Vikunja compatibility version
        id: vikunja-compat
        # Single source of truth: scripts/lib/vikunja-compat-version.sh derives this from the
        # vendored OpenAPI spec (docs/vikunja-openapi.json) and warns loudly on stderr if it
        # disagrees with the e2e docker-compose pin. Never hand-type this version — see
        # docs/RELEASING.md "Vikunja compatibility".
        run: echo "value=$(scripts/lib/vikunja-compat-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Determine minimum-supported Vikunja version
        id: vikunja-min
        run: echo "value=$(scripts/lib/vikunja-compat-version.sh --min-supported)" >> "$GITHUB_OUTPUT"

      - name: Publish to npm (OIDC trusted publishing, provenance automatic)
        # Skipped when this version is already on the registry, so a re-run to
        # recover a half-finished release doesn't dead-end here (npm rejects
        # republishing an existing version).
        #
        # `--tag` is passed explicitly and always. npm applies `latest` to whatever it is
        # given unless told otherwise — it does NOT infer a channel from a prerelease
        # version string — so omitting it would hand `latest` to a beta.
        env:
          VERSION: ${{ steps.ref.outputs.version }}
          DIST_TAG: ${{ steps.ref.outputs.dist_tag }}
        run: |
          set -euo pipefail
          if npm view "vikunja-mcp-ng@${VERSION}" version > /dev/null 2>&1; then
            echo "vikunja-mcp-ng@${VERSION} is already published — skipping (idempotent)."
          else
            npm publish --access public --tag "${DIST_TAG}"
          fi

  # ---------------------------------------------------------------------------
  # One native runner per architecture. Pushes by digest only; tags are applied
  # by the `manifest` job below.
  # ---------------------------------------------------------------------------
  image:
    needs: npm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.npm.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.version=${{ needs.npm.outputs.version }}
            io.vikunja.compat=${{ needs.npm.outputs.compat }}
            io.vikunja.min-supported=${{ needs.npm.outputs.min }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Assemble the multi-arch manifest list and apply every tag to it.
  # ---------------------------------------------------------------------------
  manifest:
    needs: [npm, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.digest.outputs.value }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          VERSION: ${{ needs.npm.outputs.version }}
          DIST_TAG: ${{ needs.npm.outputs.dist_tag }}
          COMPAT: ${{ needs.npm.outputs.compat }}
          MIN: ${{ needs.npm.outputs.min }}
        run: |
          set -euo pipefail
          # DIST_TAG is `latest` for a stable release and the channel name for a prerelease,
          # so a beta lands on `:beta` and never moves `:latest`.
          TAGS=(-t "${IMAGE}:${VERSION}" -t "${IMAGE}:${DIST_TAG}" -t "${IMAGE}:${VERSION}-vikunja${COMPAT}")
          if [[ "${MIN}" != "${COMPAT}" ]]; then
            TAGS+=(-t "${IMAGE}:${VERSION}-vikunja${MIN}")
          fi
          docker buildx imagetools create "${TAGS[@]}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Read manifest digest
        id: digest
        env:
          VERSION: ${{ needs.npm.outputs.version }}
        run: |
          set -euo pipefail
          echo "value=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # GitHub release, with an artifacts footer that can only be written once the
  # image digest actually exists.
  # ---------------------------------------------------------------------------
  release:
    needs: [npm, manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.npm.outputs.tag }}
          fetch-depth: 0

      - name: Extract changelog section for this version
        env:
          VERSION: ${{ needs.npm.outputs.version }}
        run: |
          set -euo pipefail
          START_LINE="$(grep -n -E "^## \[${VERSION}\]" CHANGELOG.md | head -1 | cut -d: -f1)"
          if [[ -z "$START_LINE" ]]; then
            echo "::error::No '## [$VERSION]' section found in CHANGELOG.md"
            exit 1
          fi
          END_LINE="$(tail -n "+$((START_LINE + 1))" CHANGELOG.md | grep -n -E '^## \[' | head -1 | cut -d: -f1 || true)"
          if [[ -n "$END_LINE" ]]; then
            END_LINE=$((START_LINE + END_LINE - 1))
          else
            END_LINE="$(wc -l < CHANGELOG.md | tr -d ' ')"
          fi
          sed -n "${START_LINE},${END_LINE}p" CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Append artifacts footer to release notes
        env:
          VERSION: ${{ needs.npm.outputs.version }}
          DIST_TAG: ${{ needs.npm.outputs.dist_tag }}
          PRERELEASE: ${{ needs.npm.outputs.prerelease }}
          COMPAT: ${{ needs.npm.outputs.compat }}
          MIN: ${{ needs.npm.outputs.min }}
          DIGEST: ${{ needs.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          IMG="${IMAGE}"
          # All tags are aliases on one manifest-list digest. Listing each alias with its digest
          # keeps the notes truthful if a version ever gets its own build.
          {
            echo ""
            echo "---"
            echo ""
            if [[ "${PRERELEASE}" == "true" ]]; then
              echo "### Pre-release"
              echo ""
              echo "This is a **${DIST_TAG}** release. It does not move \`latest\` on npm or GHCR —"
              echo "\`npm install vikunja-mcp-ng\` and \`${IMG}:latest\` keep serving the newest stable"
              echo "version. Opt in explicitly:"
              echo ""
              echo '```bash'
              echo "npm install -g vikunja-mcp-ng@${DIST_TAG}   # or @${VERSION} to pin exactly"
              echo '```'
              echo ""
            fi
            echo "### Artifacts"
            echo ""
            echo "**npm:** [\`vikunja-mcp-ng@${VERSION}\`](https://www.npmjs.com/package/vikunja-mcp-ng/v/${VERSION}) — \`npm install -g vikunja-mcp-ng@${VERSION}\`, published with OIDC provenance on the \`${DIST_TAG}\` dist-tag."
            echo ""
            echo "**Docker:** [\`${IMG}\`](https://github.com/netadvanced/vikunja-mcp-ng/pkgs/container/vikunja-mcp-ng) — \`linux/amd64\` + \`linux/arm64\`; all tags below are aliases on one digest:"
            echo ""
            echo "| Tag | Digest |"
            echo "|---|---|"
            echo "| \`${VERSION}\` | \`${DIGEST}\` |"
            echo "| \`${DIST_TAG}\` | \`${DIGEST}\` |"
            echo "| \`${VERSION}-vikunja${COMPAT}\` (aligned) | \`${DIGEST}\` |"
            if [[ "${MIN}" != "${COMPAT}" ]]; then
              echo "| \`${VERSION}-vikunja${MIN}\` (min-supported) | \`${DIGEST}\` |"
            fi
          } >> release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.npm.outputs.tag }}
          PRERELEASE: ${{ needs.npm.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists — skipping (idempotent)."
          else
            # --prerelease keeps a beta off the repository's "Latest" badge; without it the
            # GitHub front page would present it as the current release.
            EXTRA=()
            [[ "${PRERELEASE}" == "true" ]] && EXTRA+=(--prerelease)
            gh release create "${TAG}" --title "${TAG}" --notes-file release-notes.md "${EXTRA[@]+"${EXTRA[@]}"}"
          fi
